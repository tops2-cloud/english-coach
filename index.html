<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Language Coach</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🦉</span> Language Coach</div>
    <button id="levelBtn" class="level-chip" aria-label="เปลี่ยนระดับ"></button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="เมนูหลัก">
    <button data-tab="home"><span class="ti">🏠</span><span>หน้าหลัก</span></button>
    <button data-tab="vocab"><span class="ti">🃏</span><span>คำศัพท์</span></button>
    <button data-tab="quiz"><span class="ti">✅</span><span>ควิซ</span></button>
    <button data-tab="speak"><span class="ti">🎤</span><span>ฟัง-พูด</span></button>
    <button data-tab="tutor"><span class="ti">🤖</span><span>ครู AI</span></button>
    <button data-tab="translate"><span class="ti">🌐</span><span>แปล</span></button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
